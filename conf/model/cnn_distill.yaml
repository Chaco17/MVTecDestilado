# Model B: same student as model A, trained by distillation from a pretrained ResNet-18 (teacher)
# with the STFPM method (Wang et al., 2021). Arguments of src.models.distill.DistillModule.
# It starts from cnn_scratch.yaml (student, head, optimizer) and only changes or adds what is
# specific to distillation.
defaults:
  - cnn_scratch
  - _self_

_target_: src.models.distill.DistillModule
name: cnn_distill

teacher:
  weights: IMAGENET1K_V1   # torchvision weights of the ResNet-18 pretrained on ImageNet

distill:
  layers: [conv2_x, conv3_x]   # stages whose feature maps the student imitates
  weight: 1.0                  # loss = CE + weight * STFPM

# AdamW with lr 3e-4 instead of the 1e-3 of model A: in the first runs of model B a learning rate
# around 6e-4 still produced a spike at epoch 22 that stopped training while the STFPM loss kept going down.
optimizer:
  lr: 3.0e-4

# Cosine learning rate by default: in model A it was what removed the oscillations of a constant lr
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  _partial_: true
  T_max: ${trainer.max_epochs}
  eta_min: 1.0e-5
