# Model A: first three stages of ResNet-18 (conv1, conv2_x, conv3_x) with random weights,
# followed by an FC classifier over the 10 categories.
# Arguments of the LightningModule src.models.cnn.CNNClassifierModule.
_target_: src.models.cnn.CNNClassifierModule
_convert_: all   # plain lists/dicts instead of OmegaConf objects (the checkpoint must load with weights_only=True)
name: cnn_scratch
num_classes: ${len:${data.categories}}

# Embedding: global average pooling of conv3_x (128 dims). null keeps it, a number adds a linear
# projection 128 -> z_dim and the embedding is taken after it (still to be decided).
z_dim: null

head:
  hidden_dim: 256
  dropout: 0.3

optimizer:
  _target_: torch.optim.AdamW
  _partial_: true    # the parameters are passed later, in configure_optimizers()
  lr: 1.0e-3
  weight_decay: 1.0e-4

scheduler: null      # constant learning rate unless an experiment sets one
