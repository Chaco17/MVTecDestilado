# @package _global_
# Model B, STFPM on conv2_x and conv3_x with SGD, the optimizer of the STFPM paper (momentum 0.9 and
# weight decay 1e-3 as in the anomalib implementation). The paper uses lr 0.4, but in a first run of
# this project that value made the classification head collapse (cross entropy stuck at ln 10), because
# the paper trains without a classifier. lr 0.05 keeps SGD and is stable with the head.
defaults:
  - override /model: cnn_distill

name: B-cnn_distill-stfpm_l23_sgd5e-2
description: Modelo B, STFPM en conv2_x y conv3_x, SGD momentum 0.9 lr coseno 0.05 -> 1e-5, batch 32
tags: [B, cnn_distill, stfpm, capas=conv2_x+conv3_x, sgd, lr=5e-2, bs=32, lr_coseno]

model:
  optimizer:
    _target_: torch.optim.SGD
    lr: 0.05
    momentum: 0.9
    weight_decay: 1.0e-3

callbacks:
  early_stopping:
    patience: 10
