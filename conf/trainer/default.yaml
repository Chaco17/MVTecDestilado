# Arguments of lightning.Trainer. The callbacks and the logger come from their own groups
# and are passed when the Trainer is instantiated.
_target_: lightning.Trainer
max_epochs: 50
accelerator: auto
devices: 1
precision: 16-mixed
log_every_n_steps: 10
enable_progress_bar: false   # the EpochSummary callback prints one line per epoch instead
